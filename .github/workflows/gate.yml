#
# The merge gate: exactly what `npm run gate` runs locally, so a green local run
# and a green CI run mean the same thing. If these ever diverge, fix the
# divergence rather than adding a CI-only step.
name: Gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      # `submodules: recursive` is load-bearing, not tidiness. Without it
      # packages/stonedog-style is an EMPTY DIRECTORY here, and jest's
      # moduleNameMapper points `stonedog-style/preset` inside it — so
      # packages/ui/test/theme.test.ts cannot load and the gate is red.
      #
      # It fails only in CI, because every local checkout has the submodule
      # initialised. That divergence is exactly what the header above forbids,
      # and it went unnoticed for eight runs: the submodule is imported by one
      # suite out of fifteen, so the run still reads as broadly healthy and
      # nothing in the message names a submodule. See NEH-249.
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Rule validation and barrel freshness run FIRST. A schema-invalid or
      # unregenerated rule produces confusing failures further down, and these
      # two name the actual problem.
      - run: npm run rules:validate
      - run: npm run rules:barrel:check
      - run: npm run type-check
      - run: npm run lint
      - run: npm test

  staleness:
    # Reports; never fails the build. A rule going stale is a fact about the
    # calendar, not about this change, and a gate that goes red on the passage
    # of time gets disabled within a month — at which point the signal is gone.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      # Needed here too: `npm ci` runs stonedog-style's `prepare`, which is
      # `panda codegen` against its own source.
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run rules:staleness
